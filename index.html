<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nicole Terminal</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #050805;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    color: #72ff72;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
}

.terminal {
    width: 100%;
    max-width: 520px;
    border: 1px solid #35b935;
    padding: 30px 22px;
    box-shadow: 0 0 30px rgba(60, 255, 60, 0.12);
}

.header {
    font-size: 13px;
    opacity: 0.65;
    letter-spacing: 2px;
    line-height: 1.5;
    margin-bottom: 35px;
}

h1 {
    font-size: 27px;
    letter-spacing: 3px;
    margin: 0 0 8px;
}

.status {
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 40px;
    letter-spacing: 1px;
}

label {
    display: block;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

input {
    width: 100%;
    background: #020402;
    color: #72ff72;
    border: 1px solid #35b935;
    padding: 16px;
    font-family: inherit;
    font-size: 22px;
    text-align: center;
    letter-spacing: 8px;
    outline: none;
    border-radius: 0;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    background: #0c260c;
    color: #72ff72;
    border: 1px solid #35b935;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 0;
}

button:active {
    background: #174217;
}

#output {
    display: none;
    margin-top: 35px;
    border-top: 1px solid #205820;
    padding-top: 25px;
    line-height: 1.7;
}

#message {
    color: #d8ffd8;
    font-size: 18px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
}

.tiny {
    margin-top: 35px;
    font-size: 10px;
    opacity: 0.4;
    text-align: center;
}

.destroyed {
    color: #72ff72 !important;
    text-align: center;
    font-size: 16px !important;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div class="terminal">

    <div class="header">
        HOLT SECURE COMMUNICATIONS // PRIVATE CHANNEL
    </div>

    <h1>NICOLE TERMINAL</h1>

    <div class="status">
        ● SECURE CHANNEL ACTIVE
    </div>

    <div id="login">

        <label for="code">ENTER ACCESS CODE</label>

        <input
            id="code"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            autocomplete="off"
        >

        <button id="retrieveButton" type="button">
            RETRIEVE MESSAGE
        </button>

    </div>

    <div id="output">

        <div class="status">
            ACCESS GRANTED // MESSAGE RETRIEVED
        </div>

        <div id="message"></div>

        <button id="destroyButton" type="button">
            DESTROY MESSAGE
        </button>

    </div>

    <div class="tiny">
        AUTHORIZED RECIPIENT ONLY
    </div>

</div>

<script>

/*
====================================================
              NICOLE TERMINAL
====================================================

CURRENT ACCESS CODE: 52
====================================================
*/

const ACCESS_CODE = "43";

const MESSAGE_ID = "NICOLE-20261006-1051-C";

const CURRENT_MESSAGE = ` I'm going to fuck you until I'm just about to cum and I'll pull out and pre-cum on your asshole and I'll fuck your ass with my cock and a dildo inside your dripping juicy wet peach while i rub your clit`;


/*
====================================================
DO NOT EDIT ANYTHING BELOW THIS LINE
====================================================
*/

const codeInput =
    document.getElementById("code");

const login =
    document.getElementById("login");

const output =
    document.getElementById("output");

const messageBox =
    document.getElementById("message");

const retrieveButton =
    document.getElementById("retrieveButton");

const destroyButton =
    document.getElementById("destroyButton");


function getDestroyedKey() {

    return "nicole_terminal_" +
           MESSAGE_ID +
           "_destroyed";

}


function retrieveMessage() {

    const enteredCode =
        String(codeInput.value).trim();

    if (enteredCode !== ACCESS_CODE) {

        alert("ACCESS DENIED // INVALID CODE");

        codeInput.value = "";

        codeInput.focus();

        return;

    }

    const destroyed =
        localStorage.getItem(getDestroyedKey());

    if (destroyed === "true") {

        alert(
            "MESSAGE DESTROYED // ACCESS TOKEN INVALIDATED"
        );

        codeInput.value = "";

        codeInput.focus();

        return;

    }

    login.style.display = "none";

    output.style.display = "block";

    messageBox.className = "";

    messageBox.textContent = CURRENT_MESSAGE;

    destroyButton.style.display = "block";

}


function destroyMessage() {

    try {

        localStorage.setItem(
            getDestroyedKey(),
            "true"
        );

    } catch (error) {

    }

    messageBox.className = "destroyed";

    messageBox.textContent =
        "PURGING MESSAGE...\n\n" +
        "[##########] 100%\n\n" +
        "MESSAGE DESTROYED\n\n" +
        "ACCESS TOKEN INVALIDATED";

    destroyButton.style.display = "none";

    setTimeout(function () {

        output.style.display = "none";

        login.style.display = "block";

        messageBox.textContent = "";

        messageBox.className = "";

        codeInput.value = "";

        codeInput.focus();

    }, 2500);

}


retrieveButton.addEventListener(
    "click",
    function () {

        retrieveMessage();

    }
);


destroyButton.addEventListener(
    "click",
    function () {

        destroyMessage();

    }
);


codeInput.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();

            retrieveMessage();

        }

    }
);


window.addEventListener(
    "load",
    function () {

        codeInput.value = "";

        codeInput.focus();

    }
);

</script>

</body>

</html>
